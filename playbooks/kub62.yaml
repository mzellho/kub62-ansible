---
- name: Trust cluster SSH host keys
  hosts: all
  gather_facts: false
  become: false
  tags: [ssh, always]
  tasks:
    - name: Register cluster host keys on controller
      ansible.builtin.known_hosts:
        name: "{{ ansible_host | default(inventory_hostname) }}"
        state: present
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 ' + (ansible_host | default(inventory_hostname))) }}"
      delegate_to: localhost
      failed_when: false
      changed_when: false

- name: Pick the API host
  ansible.builtin.import_playbook: api-host.yaml

- name: Prepare all cluster nodes
  hosts: all
  become: true
  serial: 1
  tags: [base]
  roles:
    - ../roles/base

- name: Configure control plane
  hosts: control_plane
  become: true
  serial: 1
  tags: [k3s, control-plane]
  roles:
    - ../roles/k3s/base
    - ../roles/k3s/control-plane

- name: Configure control-plane add-ons
  hosts: control_plane
  become: true
  serial: 1
  tags: [addons]
  roles:
    - role: ../roles/k3s/control-plane/addons/cilium
      tags: [cilium]
    - role: ../roles/k3s/control-plane/addons/sops
      tags: [sops]
    # Before flux: the bootstrap needs the pinned Flux CLI.
    - role: ../roles/k3s/control-plane/addons/clis
      tags: [clis]
    - role: ../roles/k3s/control-plane/addons/flux
      tags: [flux]

- name: Configure worker nodes
  hosts: worker
  become: true
  serial: 1
  tags: [k3s, worker]
  roles:
    - ../roles/k3s/base
    - ../roles/k3s/worker

- name: Reconcile Kubernetes node labels
  hosts: control_plane
  become: true
  tags: [k3s, labels]
  roles:
    - ../roles/k3s/labels

- name: Install node maintenance tooling
  hosts: control_plane:worker
  become: true
  tags: [k3s, maintenance]
  roles:
    - ../roles/k3s/maintenance

- name: Configure kiosk nodes
  hosts: kiosk
  become: true
  tags: [kiosk]
  roles:
    - ../roles/kiosk
