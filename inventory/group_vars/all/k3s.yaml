---
# Roles follow the groups: the first control_plane host initialises the cluster,
# further ones join as servers, worker hosts join as agents.
# Point both at a running server while the first one is being rebuilt.
k3s_init_server: "{{ groups['control_plane'] | first }}"
k3s_api_host: "{{ k3s_init_server }}"
# true moves the init server from SQLite to embedded etcd on the next run.
k3s_embedded_etcd: false
k3s_url: "https://{{ k3s_vip | default('', true) or hostvars[k3s_init_server]['ansible_host'] }}:6443"
k3s_group_labels: "{{ ['kub62.local/kiosk=true'] if inventory_hostname in groups.get('kiosk', []) else [] }}"
# The kubelet may not set node-role labels itself, so only the labels role applies these.
# Servers stay schedulable, so they carry the worker role as well.
k3s_role_labels: >-
  {{ (['node-role.kubernetes.io/control-plane=true'] if inventory_hostname in groups['control_plane'] else [])
     + (['node-role.kubernetes.io/worker=true'] if inventory_hostname in groups['control_plane'] + groups['worker'] else []) }}
k3s_node_label_flags: >-
  {{ (k3s_node_labels | default([]) + k3s_group_labels) | map('regex_replace', '^(.+)$', '--node-label \1') | join(' ') }}
k3s_server_cilium_flags: "{{ '--flannel-backend=none --disable-network-policy' if (cilium | default(false) | bool) else '' }}"
k3s_server_join_flag: "{{ '--cluster-init' if inventory_hostname == k3s_init_server else '--server ' ~ k3s_url }}"
k3s_server_flags: "server {{ k3s_server_common_flags }} {{ k3s_server_cilium_flags }} {{ k3s_server_join_flag }}"
k3s_exec_flags: >-
  {{ ((k3s_server_flags if inventory_hostname in groups['control_plane'] else 'agent') ~ ' ' ~ k3s_node_label_flags) | split | join(' ') }}
# Servers run the API server and controllers inside the k3s process.
k3s_kubelet_config:
  apiVersion: kubelet.config.k8s.io/v1beta1
  kind: KubeletConfiguration
  kubeReserved:
    cpu: "{{ '500m' if inventory_hostname in groups['control_plane'] else '250m' }}"
    memory: "{{ '1536Mi' if inventory_hostname in groups['control_plane'] else '512Mi' }}"
  systemReserved:
    cpu: 250m
    memory: 512Mi
  # Replaces k3s' defaults, so the disk thresholds are repeated.
  evictionHard:
    memory.available: 300Mi
    nodefs.available: 5%
    imagefs.available: 5%
  imageMaximumGCAge: 336h
