---
# Copy to inventory/hosts.yaml (gitignored) and adapt. Node labels and taints go to
# inventory/host_vars/<host>.yaml, versions to inventory/group_vars/all/versions.yaml.
kub62:
  hosts:
    node-1:
      ansible_host: 192.168.10.11
      clone_destination: nvme
    node-2:
      ansible_host: 192.168.10.12
      clone_destination: nvme
    node-3:
      ansible_host: 192.168.10.13
      clone_destination: nvme
    node-4:
      ansible_host: 192.168.10.14
      clone_destination: nvme
    # An amd64 worker on Debian: its own user, the Raspberry Pi steps are skipped.
    worker-1:
      ansible_host: 192.168.10.21
      ansible_user: kub
    node-5:
      ansible_host: 192.168.10.31
      clone_destination: usb
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: "{{ lookup('env','HOME') }}/.ssh/id_ed25519"
    ansible_uid: 1000
    ansible_user: pi
    clone_label_prefix: kub62
    locale: de_AT.UTF-8
    timezone: Europe/Vienna
    k3s_server_common_flags: "--write-kubeconfig-mode=600 --disable traefik --disable servicelb --disable local-storage"
    # Single resolver for pods and CoreDNS, e.g. the router.
    k3s_pod_resolver: 192.168.10.1
    # Pod network and node subnet; they may reach the metrics and rpcbind ports (group_vars/all/firewall.yaml).
    host_firewall_sources: [10.42.0.0/16, 192.168.10.0/24]
    # Secret in kube-system with the S3 target; empty keeps snapshots local only.
    k3s_etcd_s3_secret: k3s-etcd-s3
    # Empty disables roles/k3s/control-plane/tasks/oidc.yaml.
    k3s_oidc_issuer_url: "https://auth.example.com/application/o/headlamp/"
    k3s_oidc_client_id: headlamp
    k3s_oidc_username_claim: preferred_username
    k3s_oidc_groups_claim: groups
    k3s_oidc_prefix: "oidc:"
    # API virtual IP served by kube-vip; empty means the first server's address.
    k3s_vip: 192.168.10.5
    kube_vip_interface: eth0
    # Plain here; encrypt it in the real inventory with ansible-vault (see README, "Secrets").
    k3s_token: 4711
  children:
    control_plane:
      hosts:
        node-1:
          sops_key: age.agekey
          flux_bootstrap: true
          flux_branch: main
          flux_owner: me
          flux_path: some/repo/path
          flux_personal: true
          flux_repository: my-gitops-flux
          # flux_pat is only needed to bootstrap an empty cluster: pass it with -e flux_pat=... instead of storing it.
        node-2:
          flux_bootstrap: false
        node-3:
          flux_bootstrap: false
      vars:
        cilium: true
        flux_enabled: true
    kiosk:
      hosts:
        node-5:
      vars:
        bodgestr_device_usb_id: "1324:5678"
        kiosk_urls: "https://example.com/1 https://example.com/2 https://example.com/3"
    worker:
      hosts:
        node-4:
        worker-1:
