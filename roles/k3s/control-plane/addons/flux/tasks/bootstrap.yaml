---
- name: Check for an existing Flux installation
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, namespace, flux-system]
  register: k3s_flux_namespace
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - flux_bootstrap | default(false) | bool
    - inventory_hostname == k3s_api_host

- name: Bootstrap GitOps with GitHub
  ansible.builtin.shell: |
    flux bootstrap github \
      --owner={{ flux_owner }} \
      --repository={{ flux_repository }} \
      --branch={{ flux_branch }} \
      --path={{ flux_path }} \
      --personal={{ flux_personal | lower }} \
      --token-auth
  args:
    executable: /bin/bash
  environment:
    GITHUB_TOKEN: "{{ flux_pat }}"
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  register: flux_bootstrap_result
  changed_when: false
  when:
    - flux_bootstrap | default(false) | bool
    - inventory_hostname == k3s_api_host
    - k3s_flux_namespace.rc != 0
  become: false
