---
- name: Configure control plane service
  ansible.builtin.import_tasks: k3s.yaml
- name: Move the datastore to embedded etcd
  ansible.builtin.import_tasks: etcd.yaml
  when:
    - k3s_embedded_etcd | bool
    - inventory_hostname == k3s_init_server
  tags: [etcd]
- name: Trust Authentik as an OIDC provider
  ansible.builtin.import_tasks: oidc.yaml
  tags: [oidc]
- name: Copy etcd snapshots off-site
  ansible.builtin.import_tasks: etcd-s3.yaml
  when:
    - k3s_embedded_etcd | bool
    - k3s_etcd_s3_secret | default('') | length > 0
  tags: [etcd-s3]
- name: Serve the API on a virtual IP
  ansible.builtin.import_tasks: kube-vip.yaml
  when: k3s_vip | default('') | length > 0
  tags: [kube-vip]
- name: Install control plane packages
  ansible.builtin.import_tasks: packages.yaml
- name: Configure shell autocompletion
  ansible.builtin.import_tasks: autocomplete.yaml
