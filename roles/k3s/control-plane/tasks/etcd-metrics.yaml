---
# etcd metrics on the node address (port 2381) for the etcd* alerts and dashboards in Prometheus.
- name: Expose etcd metrics
  ansible.builtin.copy:
    content: |
      ---
      # Managed by Ansible - roles/k3s/control-plane/tasks/etcd-metrics.yaml
      etcd-expose-metrics: true
    dest: /etc/rancher/k3s/config.yaml.d/50-etcd-metrics.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s
