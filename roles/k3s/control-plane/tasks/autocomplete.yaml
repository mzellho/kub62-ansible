---
- name: Ensure bash completion directory exists
  ansible.builtin.file:
    path: /etc/bash_completion.d
    state: directory
    mode: "0755"

# Rendered every run, so it follows k3s upgrades.
- name: Render kubectl shell completion
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, completion, bash]
  register: k3s_kubectl_completion
  changed_when: false
  # k3s does not exist yet in a dry run of a fresh install.
  when: not ansible_check_mode

- name: Enable kubectl shell completion
  ansible.builtin.copy:
    content: "{{ k3s_kubectl_completion.stdout }}\n"
    dest: /etc/bash_completion.d/kubectl
    owner: root
    group: root
    mode: "0644"
  when: k3s_kubectl_completion is not skipped

- name: Enable kubectl alias with completion
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - kubectl alias"
    block: |
      alias k=kubectl
      complete -o default -F __start_kubectl k
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
