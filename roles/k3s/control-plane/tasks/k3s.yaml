---
- name: Check for an existing k3s agent
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_unit

- name: Refuse to reuse an agent as server
  ansible.builtin.fail:
    msg: "{{ inventory_hostname }} runs k3s-agent; run k3s-agent-uninstall.sh before it joins as server."
  when: k3s_agent_unit.stat.exists

- name: Install control plane # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | K3S_TOKEN="{{ k3s_token }}" INSTALL_K3S_VERSION="{{ k3s_version }}" INSTALL_K3S_EXEC="{{ k3s_exec_flags | trim }}" sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  no_log: true

- name: Harden kubeconfig permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0600"

- name: Ensure user kube config directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Publish kubeconfig for default user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    remote_src: true

- name: Persist kubeconfig environment for shells
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.profile"
    line: "export KUBECONFIG=~/.kube/config"
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
