---
# Encrypts Secrets at rest, so etcd snapshots no longer carry them in plain text.
# Before the first start on a new cluster; an existing one needs the k3s
# enable/rotate-keys procedure first.
- name: Ensure the k3s config drop-in directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    mode: "0755"

- name: Encrypt secrets at rest
  ansible.builtin.copy:
    content: |
      ---
      # Managed by Ansible - roles/k3s/control-plane/tasks/secrets-encryption.yaml
      secrets-encryption: true
    dest: /etc/rancher/k3s/config.yaml.d/40-secrets-encryption.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s
