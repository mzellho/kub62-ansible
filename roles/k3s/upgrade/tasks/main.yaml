---
# Binary swap only: rerunning the installer would apply --cluster-init from the inventory.
- name: Read installed k3s version
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_version_installed
  changed_when: false
  check_mode: false

- name: Replace k3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/{{ k3s_upgrade_asset }}"
    checksum: "sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/sha256sum-{{ k3s_upgrade_arch }}.txt"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
    force: true
  vars:
    k3s_upgrade_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts['architecture']] }}"
    k3s_upgrade_asset: "{{ 'k3s' if k3s_upgrade_arch == 'amd64' else 'k3s-' ~ k3s_upgrade_arch }}"
  when: k3s_version not in k3s_version_installed.stdout
  notify: Restart upgraded k3s

- name: Restart k3s if the binary changed
  ansible.builtin.meta: flush_handlers

- name: Wait for node to report the new version
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - "jsonpath={.status.nodeInfo.kubeletVersion} {.status.conditions[?(@.type=='Ready')].status}"
  delegate_to: "{{ k3s_api_host }}"
  register: k3s_node_state
  until: k3s_node_state.rc == 0 and k3s_node_state.stdout == k3s_version ~ ' True'
  retries: 60
  delay: 5
  changed_when: false
  when: not ansible_check_mode
