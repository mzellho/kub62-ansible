---
- name: Ensure kernel cgroup flags are set
  ansible.builtin.shell: |
    set -o pipefail
    changed=false
    line=$(cat /boot/firmware/cmdline.txt)
    for flag in cgroup_memory=1 cgroup_enable=memory; do
      if ! echo "$line" | grep -qw "$flag"; then
        line="$line $flag"
        changed=true
      fi
    done
    if [ "$changed" = true ]; then
      echo "$line" > /boot/firmware/cmdline.txt
      echo "changed"
    else
      echo "ok"
    fi
  args:
    executable: /bin/bash
  register: cmdline_cgroup
  changed_when: "'changed' in cmdline_cgroup.stdout"

- name: Flag reboot after kernel flag changes # noqa: no-handler
  ansible.builtin.set_fact:
    reboot_needed: true
  when: cmdline_cgroup.changed
