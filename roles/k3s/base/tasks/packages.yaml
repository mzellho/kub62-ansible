---
- name: Install k3s and Longhorn dependencies
  ansible.builtin.apt:
    name:
      # The join task pipes the k3s installer through curl; Raspberry Pi OS ships it, Debian does not.
      - curl
      - open-iscsi
      - nfs-common
      - smartmontools
      - cryptsetup
    state: present

- name: Load kernel modules Longhorn checks for
  community.general.modprobe:
    name: dm_crypt
    state: present
    persistent: present
