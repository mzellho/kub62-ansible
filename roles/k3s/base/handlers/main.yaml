---
# kub62-node checks etcd and hands over the etcd leadership and the API VIP before it restarts k3s
# (review3 F-82). Skipped on fresh installs: k3s reads the config on its first start.
- name: Restart k3s
  ansible.builtin.shell: |
    set -o pipefail
    if /usr/local/bin/kub62-node --help 2>/dev/null | grep -q restart-k3s; then
      /usr/local/bin/kub62-node -y {{ kub62_node_flags }} restart-k3s
    else
      # First run after an upgrade of this repository: the old kub62-node has no restart-k3s yet.
      systemctl daemon-reload
      systemctl restart {{ 'k3s' if inventory_hostname in (groups['control_plane'] | default([])) else 'k3s-agent' }}
    fi
  args:
    executable: /bin/bash
  changed_when: true
  when: k3s_installed.stat.exists | default(false)
  # Handlers inherit play tags; without always, --tags dns would skip the restart.
  tags: always

- name: Restart CoreDNS
  # Running pods keep their resolv.conf snapshot until restarted.
  ansible.builtin.command:
    cmd: kubectl --namespace kube-system rollout restart deployment/coredns
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ k3s_api_host }}"
  run_once: true
  changed_when: true
  when: k3s_installed.stat.exists | default(false)
  tags: always

- name: Reload host firewall
  ansible.builtin.systemd_service:
    name: kub62-host-firewall
    state: reloaded
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
