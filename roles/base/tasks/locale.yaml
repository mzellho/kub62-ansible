---
- name: Generate locale {{ locale }}
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

# On Trixie /etc/default/locale is a symlink to /etc/locale.conf; file attributes would compare the link.
- name: Set locale variables
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^{{ item }}="
    line: "{{ item }}={{ locale }}"
  loop:
    - LANG
    - LC_ALL
