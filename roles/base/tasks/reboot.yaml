---
# A node in the cluster only gets /var/run/reboot-required: kub62-node reboots it with its checks
# (kub62-node reboot-if-required, or playbooks/maintenance.yaml). A node without k3s reboots right away.
- name: Decide whether to reboot
  ansible.builtin.set_fact:
    base_reboot: "{{ reboot_needed | default(false) | bool }}"

- name: Check whether k3s runs on the node
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: base_reboot_k3s
  when: base_reboot | bool

- name: Mark the reboot for kub62-node
  ansible.builtin.copy:
    content: "kub62-ansible\n"
    dest: /var/run/reboot-required
    owner: root
    group: root
    mode: "0644"
  when:
    - base_reboot | bool
    - base_reboot_k3s.stat.exists

- name: Report the pending reboot
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} needs a reboot: kub62-node reboot-if-required, or playbooks/maintenance.yaml -e maintenance_action=reboot-if-required"
  when:
    - base_reboot | bool
    - base_reboot_k3s.stat.exists

- name: Reboot a node outside the cluster
  ansible.builtin.reboot:
    msg: "Reboot after setup of {{ inventory_hostname }}"
    connect_timeout: 10
    reboot_timeout: 1200
    post_reboot_delay: 10
  when:
    - base_reboot | bool
    - not base_reboot_k3s.stat.exists

- name: Reset reboot flag
  ansible.builtin.set_fact:
    reboot_needed: false
