---
- name: Decide whether to reboot
  ansible.builtin.set_fact:
    base_reboot: "{{ (reboot_needed | default(false) | bool) or (base_force_reboot | default(false) | bool) }}"

- name: Check whether the node is part of the cluster
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, node, "{{ inventory_hostname }}", --no-headers]
  delegate_to: "{{ k3s_api_host }}"
  register: base_cluster_node
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - base_reboot | bool
    - inventory_hostname in groups.get('control_plane', []) + groups.get('worker', [])

- name: Drain node before reboot
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - drain
      - "{{ inventory_hostname }}"
      - --ignore-daemonsets
      - --delete-emptydir-data
      - --timeout=900s
  delegate_to: "{{ k3s_api_host }}"
  changed_when: true
  when: base_cluster_node.rc | default(1) == 0

- name: Reboot system if any change requires it
  ansible.builtin.reboot:
    msg: "Reboot after setup of {{ inventory_hostname }}"
    connect_timeout: 10
    reboot_timeout: 1200
    post_reboot_delay: 10
  register: reboot_result
  when: base_reboot | bool

- name: Wait for node to become Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - "jsonpath={.status.conditions[?(@.type=='Ready')].status}"
  delegate_to: "{{ k3s_api_host }}"
  register: base_node_ready
  until: base_node_ready.rc == 0 and base_node_ready.stdout == 'True'
  retries: 60
  delay: 10
  changed_when: false
  when: base_cluster_node.rc | default(1) == 0

- name: Uncordon node after reboot
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, uncordon, "{{ inventory_hostname }}"]
  delegate_to: "{{ k3s_api_host }}"
  changed_when: true
  when: base_cluster_node.rc | default(1) == 0

- name: Reset reboot flag
  ansible.builtin.set_fact:
    reboot_needed: false
  when: reboot_result is not skipped
