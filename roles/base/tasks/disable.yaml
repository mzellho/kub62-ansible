---
- name: Disable optional boot features
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "{{ item }}"
    state: present
  loop:
    - dtoverlay=disable-bt
    - dtparam=act_led_trigger=none
    - dtparam=act_led_activelow=on
    - dtparam=audio=off
  register: disable_features
  # config.txt exists on Raspberry Pis only.
  when: ansible_facts['architecture'] == 'aarch64'

- name: Flag reboot after boot config changes
  ansible.builtin.set_fact:
    reboot_needed: true
  when: disable_features is not skipped and disable_features.results | selectattr('changed') | list | length > 0

- name: Disable unused services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ModemManager
  register: disable_services_result
  # Absent on some images; any other error still fails.
  failed_when:
    - disable_services_result is failed
    - "'Could not find the requested service' not in (disable_services_result.msg | default(''))"

# NetworkManager would start it again via D-Bus activation; WiFi stays off.
- name: Mask wpa_supplicant
  ansible.builtin.systemd:
    name: wpa_supplicant
    state: stopped
    enabled: false
    masked: true

# The Imager's user-data keeps the first hostname and rewrites /etc/hosts with it on every boot. The
# network is NetworkManager's own DHCP profile, so cloud-init has nothing left to do after the first boot.
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /etc/cloud
  register: base_cloud_init

- name: Disable cloud-init after the first boot
  ansible.builtin.copy:
    content: ""
    dest: /etc/cloud/cloud-init.disabled
    owner: root
    group: root
    mode: "0644"
  when: base_cloud_init.stat.exists
