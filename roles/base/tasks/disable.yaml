---
- name: Disable optional boot features
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "{{ item }}"
    state: present
  loop:
    - dtoverlay=disable-bt
    - dtparam=act_led_trigger=none
    - dtparam=act_led_activelow=on
    - dtparam=audio=off
  register: disable_features

- name: Flag reboot after boot config changes
  ansible.builtin.set_fact:
    reboot_needed: true
  when: disable_features.results | selectattr('changed') | list | length > 0

- name: Disable unused services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ModemManager
  register: disable_services_result
  failed_when: false

# NetworkManager would start it again via D-Bus activation; WiFi stays off.
- name: Mask wpa_supplicant
  ansible.builtin.systemd:
    name: wpa_supplicant
    state: stopped
    enabled: false
    masked: true
